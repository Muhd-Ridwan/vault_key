name: Build and deploy - Vault Key

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "db/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ridwan432/vaultkeydockrepo:latest

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "$VPS_SSH_KEY" > /tmp/vps_key
          chmod 600 /tmp/vps_key

          ssh -o StrictHostKeyChecking=no -i /tmp/vps_key "$VPS_USER@$VPS_HOST" bash << 'EQF'
            set -e
            source /home/rwpnt/vault_key/.env

            echo "--- Updating git history and resetting code for deploy ---"
            cd /home/rwpnt/vault_key
            git fetch origin main
            git reset --hard origin/main

            echo "--- Applying Migration ---"
            for migration in $(ls /home/rwpnt/vault_key/db/migrations/*.sql | sort); do
              PGPASSWORD="$POSTGRES_PASSWORD" docker compose exec -T db psql -U postgres vaultkey < "$migration"
            done

            echo "--- Pulling latest image ---"
            docker compose pull

            echo "--- Restarting containers ---"
            docker compose up -d

            echo "--- Verifying containers are running ---"
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' vaultkeydockrepo)" = "true" ]; then
              echo "Container is running successfully."
            else
              echo "ERROR: Container failed to start!"
              docker logs vaultkeydockrepo
              exit 1
            fi
            echo "Deploy completed successfully."
          EQF

          rm -f /tmp/vps_key
